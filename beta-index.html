<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beta Application Environment | Port 8080</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #6366f1;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 550px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .tag {
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 9999px;
            display: inline-block;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        h1 { color: #818cf8; font-size: 30px; margin-bottom: 12px; }
        p { color: #cbd5e1; font-size: 15px; line-height: 1.6; }
        .meta-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
        }
        .meta-box span { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tag">BETA TESTING ENVIRONMENT</div>
        <h1>Beta App Environment</h1>
        <p>Chào mừng bạn đến với môi trường thử nghiệm ứng dụng mới của đội ngũ DevOps.</p>
        <div class="meta-box">
            • Dịch vụ: <span>Beta Web Application</span><br>
            • Cổng mạng (Port): <span>8080 (TCP)</span><br>
            • Thư mục gốc: <span>/var/www/beta-app/html/</span>
        </div>
    </div>
</body>
</html>
